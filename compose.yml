# Variables (set them in the .env / Portainer stack env vars):
#   SSD=/mnt/ssd/Tools          -> base folder for the data (SSD dataset)
#   PASS=YourStrongPassword     -> Perforce 'admin' super-user password
#   TZ=America/Sao_Paulo
#
# NOTE: p4d runs as PUID:PGID (default 1000:1000). The ${SSD}/perforce folder
# on the host ends up owned by that UID/GID -- set PUID/PGID to your host user.
networks:
  perforce:
    external: false
    name: perforce

services:
  perforce:
    image: finallf/perforce:latest
    container_name: perforce
    hostname: perforce
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
      - P4USER=admin
      - P4PORT=1666
      - P4PASSWD=${PASS}
      - P4CHARSET=utf8
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ${SSD}/perforce:/p4
    ports:
      - "1666:1666"
    networks:
      - perforce
    stop_grace_period: 30s
    restart: unless-stopped
